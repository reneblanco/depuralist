    function App() {
      const [lang, setLang] = useState('es');
      const t = i18n[lang];

      // --- MÁQUINA DE PSEO ---
      const nicho = 'WooCommerce'; // pSEO: hardcoded

      useEffect(() => {
        const userLang = navigator.language || navigator.userLanguage;
        if (userLang.startsWith('en')) setLang('en');
      }, []);

      const toggleLang = () => setLang(prev => prev === 'es' ? 'en' : 'es');

      const [step, setStep] = useState(0); 
      const [isProcessing, setIsProcessing] = useState(false);
      const [stats, setStats] = useState({ total: 0, valid: 0, invalid: 0, fixed: 0, disposable: 0, duplicates: 0, roles: 0, formatError: 0 });
      const [validEmails, setValidEmails] = useState([]);
      const [invalidEmails, setInvalidEmails] = useState([]);
      const [disposableDomains, setDisposableDomains] = useState(new Set());
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 50;
      const [activeTab, setActiveTab] = useState('valid');
      const fileInputRef = useRef(null);

      useEffect(() => {
        fetch('https://raw.githubusercontent.com/ivolo/disposable-email-domains/master/index.json')
          .then(res => res.json())
          .then(data => setDisposableDomains(new Set(data)))
          .catch(err => console.error("Error cargando dominios temporales:", err));
      }, []);

      const rolePrefixes = ['admin', 'administrador', 'info', 'ventas', 'sales', 'contacto', 'contact', 'soporte', 'support', 'webmaster', 'gerencia', 'direccion', 'hola', 'hello', 'facturacion', 'billing', 'pagos', 'marketing', 'rrhh', 'hr', 'recepcion', 'office', 'prensa', 'press', 'compras', 'abuse', 'test'];
      const domainFixes = { 'gmai.com': 'gmail.com', 'gamil.com': 'gmail.com', 'gimail.com': 'gmail.com', 'gmal.com': 'gmail.com', 'gmail.con': 'gmail.com', 'outlok.com': 'outlook.com', 'outloo.com': 'outlook.com', 'outlook.con': 'outlook.com', 'hotmal.com': 'hotmail.com', 'hotmai.com': 'hotmail.com', 'hormail.com': 'hotmail.com', 'hotmail.con': 'hotmail.com', 'yaho.com': 'yahoo.com', 'yahoo.con': 'yahoo.com' };

      const processFile = async (file) => {
        if (!window.XLSX) return alert("Librerías cargando...");
        setIsProcessing(true);
        try {
          const XLSX = window.XLSX;
          const data = await file.arrayBuffer();
          const workbook = XLSX.read(data);
          const worksheet = workbook.Sheets[workbook.SheetNames[0]];
          const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
          if (jsonData.length === 0) { setIsProcessing(false); return; }
          const keys = Object.keys(jsonData[0]);
          const emailKey = keys.find(k => /email|correo|e-mail/i.test(k)) || keys[0]; 
          const nameKey = keys.find(k => /nombre|name|cliente/i.test(k)); 
          const valid = []; const invalid = []; const seenEmails = new Set();
          let cFix = 0, cDisp = 0, cDup = 0, cRole = 0, cFmt = 0;
          jsonData.forEach((row, index) => {
            let originalEmail = String(row[emailKey] || '').replace(/\s+/g, '').toLowerCase();
            const name = nameKey ? String(row[nameKey] || '').trim() : `Row ${index + 2}`;
            const rowNum = index + 2; 
            if (!originalEmail) return; 
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(originalEmail)) {
              invalid.push({ name, email: originalEmail, reason: 'Formato', row: rowNum });
              cFmt++; return;
            }
            let [localPart, domain] = originalEmail.split('@');
            let currentEmail = originalEmail;
            let wasFixed = false;
            if (domainFixes[domain]) { domain = domainFixes[domain]; currentEmail = `${localPart}@${domain}`; wasFixed = true; cFix++; }
            if (rolePrefixes.includes(localPart)) { invalid.push({ name, email: currentEmail, original: originalEmail, reason: 'Rol', row: rowNum }); cRole++; return; }
            if (disposableDomains.has(domain)) { invalid.push({ name, email: currentEmail, original: originalEmail, reason: 'Spam/Temp', row: rowNum }); cDisp++; return; }
            if (seenEmails.has(currentEmail)) { invalid.push({ name, email: currentEmail, original: originalEmail, reason: 'Duplicado', row: rowNum }); cDup++; return; }
            seenEmails.add(currentEmail);
            valid.push({ [t.colName]: name, [t.colEmail]: currentEmail, _wasFixed: wasFixed, _original: originalEmail });
          });
          setValidEmails(valid); setInvalidEmails(invalid);
          setStats({ total: valid.length + invalid.length, valid: valid.length, invalid: invalid.length, fixed: cFix, disposable: cDisp, duplicates: cDup, roles: cRole, formatError: cFmt });
          setStep(2); setCurrentPage(1);
        } catch (error) { console.error(error); alert("Error leyendo el archivo."); } finally { setIsProcessing(false); }
      };

      const handleAccess = (e) => {
        e.preventDefault();
        fetch("/", {
          method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ "form-name": "acceso-herramienta", "firstName": e.target.firstName.value, "email": e.target.email.value }).toString()
        }).then(() => setStep(1)).catch(() => setStep(1));
      };

      const exportToExcel = (data, filename) => {
        if (!window.XLSX) return;
        const XLSX = window.XLSX;
        const cleanData = data.map(item => { const { _wasFixed, _original, ...rest } = item; return rest; });
        const ws = XLSX.utils.json_to_sheet(cleanData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, filename);
      };

      return (

                </div>
                <span className="text-2xl font-black font-display tracking-tighter uppercase">{t.navTitle}</span>
              </div>
              <div className="hidden md:flex items-center gap-8 font-bold font-sans text-sm uppercase tracking-wider">
                <a href="#historia" className="hover:underline decoration-2 underline-offset-4">{t.navStory}</a>
                <a href="#tutorial" className="hover:underline decoration-2 underline-offset-4">{t.navHow}</a>
              </div>
              <button onClick={toggleLang} className="flex items-center gap-2 border-2 border-ink px-3 py-1 bg-white font-bold text-sm hover:bg-ink hover:text-white transition-colors">
                <IconGlobe /> {t.navLang}
              </button>
            </div>
          </nav>

          <main className="flex-1 max-w-7xl mx-auto w-full px-6 py-12 md:py-20">
            {step === 0 && (
              <div className="animate-in fade-in duration-500">
                <div className="max-w-4xl">
                  <div className="inline-block border-2 border-ink bg-white px-4 py-1 font-bold text-xs uppercase tracking-widest mb-8">
                    {t.heroPill}
                  </div>
                  <h1 className="text-5xl md:text-7xl lg:text-8xl font-black font-display leading-[0.9] tracking-tighter uppercase">
                    {t.heroTitle1} <br/>
                    <span className="bg-highlight px-2 leading-tight border-2 border-ink inline-block mt-2 -rotate-1">
                       {nicho !== 'Emails' && nicho !== 'Correos' 
                          ? (lang === 'es' ? `correos de ${nicho}` : `${nicho} email list`) 
                          : (lang === 'es' ? `correos gratis` : `email list for free`)}
                    </span>
                  </h1>
                  <p className="mt-8 text-xl md:text-2xl font-sans font-medium max-w-2xl border-l-4 border-ink pl-6">
                    {t.heroSub}
                  </p>
                  <form onSubmit={handleAccess} className="mt-12 flex flex-col lg:flex-row gap-4 max-w-4xl w-full">
                    <input type="text" name="firstName" required placeholder={t.inputNamePlaceholder} className="w-full border-4 border-ink p-4 font-mono text-lg brutal-focus bg-white" />
                    <input type="email" name="email" required placeholder={t.inputPlaceholder} className="w-full border-4 border-ink p-4 font-mono text-lg brutal-focus bg-white" />
                    <button type="submit" className="w-full flex items-center justify-center whitespace-nowrap bg-ink text-bone font-display font-bold text-lg px-6 py-4 border-4 border-transparent hover:bg-highlight hover:text-ink hover:border-ink transition-all">
                      {t.btnAccess}
                    </button>
                  </form>
                  
                  <div className="mt-6 flex flex-col items-start gap-2">
                    <p className="font-sans font-bold text-ink bg-highlight inline-block px-3 py-1 border-2 border-ink">
                      {t.heroNote}
                    </p>
                    <p className="font-mono text-xs text-gray-500 ml-1">{t.spamNote}</p>
                  </div>
                </div>

                <div id="historia" className="mt-32 border-t-4 border-ink pt-16 grid grid-cols-1 md:grid-cols-2 gap-16">
                  <h2 className="text-4xl font-black font-display uppercase tracking-tight mb-6">{t.storyTitle}</h2>
                  <div className="space-y-6 font-sans text-lg font-medium leading-relaxed">
                    <p>{t.storyP1}</p>
                    <p className="bg-white p-6 border-2 border-ink">{t.storyP2}</p>
                    <p><strong>{t.storyP3}</strong></p>
                  </div>
                </div>

                <div id="tutorial" className="mt-32">
                  <h2 className="text-4xl font-black font-display uppercase tracking-tight mb-12 text-center">{t.howTitle}</h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div className="bg-white border-4 border-ink p-8 relative">
                      <div className="absolute -top-5 -left-5 bg-highlight border-4 border-ink w-12 h-12 flex items-center justify-center font-black text-xl">1</div>
                      <h3 className="font-display font-bold text-2xl mb-4 mt-2">{t.howStep1}</h3>
                      <p className="font-sans font-medium">{t.howDesc1}</p>
                    </div>
                    <div className="bg-ink text-bone border-4 border-ink p-8 relative">
                      <div className="absolute -top-5 -left-5 bg-white text-ink border-4 border-ink w-12 h-12 flex items-center justify-center font-black text-xl">2</div>
                      <h3 className="font-display font-bold text-2xl mb-4 mt-2">{t.howStep2}</h3>
                      <p className="font-sans font-medium opacity-90">{t.howDesc2}</p>
                    </div>
                    <div className="bg-success border-4 border-ink p-8 relative">
                      <div className="absolute -top-5 -left-5 bg-white border-4 border-ink w-12 h-12 flex items-center justify-center font-black text-xl">3</div>
                      <h3 className="font-display font-bold text-2xl mb-4 mt-2">{t.howStep3}</h3>
                      <p className="font-sans font-medium">{t.howDesc3}</p>
                    </div>
                  </div>
                </div>

                <div className="mt-32 border-t-4 border-ink pt-24 pb-12 flex flex-col items-center text-center">
                  <h2 className="text-5xl md:text-6xl font-black font-display uppercase tracking-tighter mb-6">
                    {t.ctaBottomTitle}
                  </h2>
                  <p className="font-sans text-xl md:text-2xl font-medium max-w-2xl mb-12">{t.ctaBottomSub}</p>
                  
                  {/* FORMULARIO INFERIOR CORREGIDO */}
                  <form onSubmit={handleAccess} className="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-4xl w-full text-left">
                    <input type="text" name="firstName" required placeholder={t.inputNamePlaceholder} className="w-full border-4 border-ink p-4 font-mono text-lg brutal-focus bg-white" />
                    <input type="email" name="email" required placeholder={t.inputPlaceholder} className="w-full border-4 border-ink p-4 font-mono text-lg brutal-focus bg-white" />
                    <button type="submit" className="w-full flex items-center justify-center whitespace-nowrap bg-ink text-bone font-display font-bold text-lg px-6 py-4 border-4 border-transparent hover:bg-highlight hover:text-ink hover:border-ink transition-all">
                      {t.btnAccess}
                    </button>
                  </form>
                  
                  <div className="mt-8 flex flex-col items-center gap-2">
                    <p className="font-sans font-bold text-ink bg-highlight inline-block px-4 py-2 border-2 border-ink">{t.heroNote}</p>
                    <p className="font-mono text-xs text-gray-500 mt-2">{t.spamNote}</p>
                  </div>
                </div>
              </div>
            )}

            {step === 1 && (
              <div className="max-w-3xl mx-auto mt-12 animate-in fade-in zoom-in-95 duration-300">
                <div className="mb-8">
                  <h2 className="text-4xl font-black font-display uppercase tracking-tighter">{t.uploadTitle}</h2>
                  <p className="font-mono mt-2 font-medium bg-highlight inline-block px-2 border-2 border-ink">{t.uploadSub}</p>
                </div>
                <div onDrop={(e) => { e.preventDefault(); if(e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]); }} onDragOver={e => e.preventDefault()} onClick={() => fileInputRef.current?.click()} className={`border-4 border-ink bg-white p-20 text-center cursor-pointer transition-all hover:bg-slate-50`}>
                  <input type="file" ref={fileInputRef} onChange={e => { if(e.target.files[0]) processFile(e.target.files[0]); }} accept=".xlsx, .xls, .csv" className="hidden" />
                  {isProcessing ? (
                    <div className="flex flex-col items-center animate-pulse">
                      <IconUpload className="mb-4" />
                      <h3 className="text-3xl font-black font-display uppercase">{t.processing}</h3>
                    </div>
                  ) : (
                    <div className="flex flex-col items-center">
                      <div className="bg-ink text-white p-4 rounded-full mb-6"><IconUpload /></div>
                      <h3 className="text-2xl font-bold font-sans">{t.dropArea}</h3>
                    </div>
                  )}
                </div>
              </div>
            )}

            {step === 2 && (
              <div className="animate-in fade-in duration-500">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 border-b-4 border-ink pb-6 gap-4">
                  <div>
                    <h2 className="text-4xl font-black font-display uppercase tracking-tighter">{t.resultsTitle}</h2>
                    <p className="font-mono mt-2 font-medium">{t.resultsSub}</p>
                  </div>
                  <button onClick={() => { setStep(1); setValidEmails([]); setInvalidEmails([]); }} className="border-4 border-ink bg-white font-bold px-6 py-3 hover:bg-highlight transition-colors uppercase">
                    {t.btnReset}
                  </button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                  <div className="bg-white border-4 border-ink p-6">
                    <p className="font-bold font-sans uppercase text-sm mb-2">{t.statTotal}</p>
                    <p className="font-mono text-5xl font-black">{stats.total}</p>
                  </div>
                  <div className="bg-success border-4 border-ink p-6">
                    <p className="font-bold font-sans uppercase text-sm mb-2 text-ink flex items-center gap-2"><IconCheck/> {t.statValid}</p>
                    <p className="font-mono text-5xl font-black">{stats.valid}</p>
                  </div>
                  <div className="bg-highlight border-4 border-ink p-6">
                    <p className="font-bold font-sans uppercase text-sm mb-2 text-ink flex items-center gap-2"><IconAlert/> {t.statFixed}</p>
                    <p className="font-mono text-5xl font-black">{stats.fixed}</p>
                  </div>
                </div>
                <div className="bg-danger text-ink border-4 border-ink p-6 mb-12">
                  <h3 className="font-black font-display text-2xl uppercase tracking-tighter mb-4 border-b-2 border-ink pb-2">{t.breakdownTitle} ({stats.invalid})</h3>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-6 font-mono">
                    <div><p className="font-bold text-sm uppercase">{t.reasonDupes}</p><p className="text-3xl font-black">{stats.duplicates}</p></div>
                    <div><p className="font-bold text-sm uppercase">{t.reasonSpam}</p><p className="text-3xl font-black">{stats.disposable}</p></div>
                    <div><p className="font-bold text-sm uppercase">{t.reasonRoles}</p><p className="text-3xl font-black">{stats.roles}</p></div>
                    <div><p className="font-bold text-sm uppercase">{t.reasonFormat}</p><p className="text-3xl font-black">{stats.formatError}</p></div>
                  </div>
                </div>
                <div className="bg-white border-4 border-ink overflow-hidden flex flex-col h-[600px]">
                  <div className="flex border-b-4 border-ink bg-bone">
                    <button onClick={() => { setActiveTab('valid'); setCurrentPage(1); }} className={`flex-1 py-4 px-6 font-black font-display text-lg tracking-tight transition-colors border-r-4 border-ink uppercase ${activeTab === 'valid' ? 'bg-success text-ink' : 'hover:bg-gray-200'}`}>{t.tabClean}</button>
                    <button onClick={() => { setActiveTab('invalid'); setCurrentPage(1); }} className={`flex-1 py-4 px-6 font-black font-display text-lg tracking-tight transition-colors uppercase ${activeTab === 'invalid' ? 'bg-danger text-ink' : 'hover:bg-gray-200'}`}>{t.tabTrash}</button>
                  </div>
                  <div className="flex-1 overflow-auto bg-white">
                    {activeTab === 'valid' && (
                      <table className="w-full text-left border-collapse font-mono text-sm">
                        <thead className="sticky top-0 bg-bone border-b-4 border-ink z-10">
                          <tr><th className="py-3 px-4 border-r-2 border-ink uppercase">{t.colName}</th><th className="py-3 px-4 border-r-2 border-ink uppercase">{t.colEmail}</th><th className="py-3 px-4 uppercase text-right">{t.colStatus}</th></tr>
                        </thead>
                        <tbody>
                          {validEmails.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage).map((item, i) => (
                            <tr key={i} className="border-b-2 border-gray-100 hover:bg-highlight/20">
                              <td className="py-2 px-4 border-r-2 border-gray-100">{item[t.colName]}</td>
                              <td className="py-2 px-4 border-r-2 border-gray-100 font-bold">{item[t.colEmail]}</td>
                              <td className="py-2 px-4 text-right">{item._wasFixed ? <span className="bg-highlight px-2 border border-ink text-xs font-bold uppercase tracking-tighter">FIXED</span> : <span className="text-gray-400">OK</span>}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                    {activeTab === 'invalid' && (
                      <table className="w-full text-left border-collapse font-mono text-sm">
                        <thead className="sticky top-0 bg-bone border-b-4 border-ink z-10">
                          <tr><th className="py-3 px-4 border-r-2 border-ink uppercase w-20">{t.colRow}</th><th className="py-3 px-4 border-r-2 border-ink uppercase">{t.colEmail}</th><th className="py-3 px-4 uppercase">{t.colReason}</th></tr>
                        </thead>
                        <tbody>
                          {invalidEmails.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage).map((item, i) => (
                            <tr key={i} className="border-b-2 border-gray-100 hover:bg-danger/10 text-gray-500">
                              <td className="py-2 px-4 border-r-2 border-gray-100">#{item.row}</td><td className="py-2 px-4 border-r-2 border-gray-100 line-through">{item.original}</td><td className="py-2 px-4"><span className="bg-ink text-bone px-2 font-bold text-xs uppercase">{item.reason}</span></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                  <div className="bg-bone border-t-4 border-ink p-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div className="flex items-center gap-4 font-mono font-bold">
                      <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1} className="px-3 py-1 bg-white border-2 border-ink disabled:opacity-50">←</button>
                      <span>{currentPage} / {Math.max(1, Math.ceil((activeTab === 'valid' ? validEmails.length : invalidEmails.length) / itemsPerPage))}</span>
                      <button onClick={() => setCurrentPage(p => Math.min(Math.ceil((activeTab === 'valid' ? validEmails.length : invalidEmails.length) / itemsPerPage), p + 1))} disabled={currentPage === Math.ceil((activeTab === 'valid' ? validEmails.length : invalidEmails.length) / itemsPerPage) || (activeTab === 'valid' ? validEmails.length : invalidEmails.length) === 0} className="px-3 py-1 bg-white border-2 border-ink disabled:opacity-50">→</button>
                    </div>
                    {activeTab === 'valid' && validEmails.length > 0 && (<button onClick={() => exportToExcel(validEmails, 'Lista_Limpia.xlsx')} className="flex items-center gap-2 px-6 py-3 bg-ink text-bone font-display font-bold uppercase border-2 border-transparent hover:bg-success hover:text-ink hover:border-ink transition-all"><IconDownload /> {t.btnDownloadClean}</button>)}
                    {activeTab === 'invalid' && invalidEmails.length > 0 && (<button onClick={() => exportToExcel(invalidEmails, 'Basura_Descartada.xlsx')} className="flex items-center gap-2 px-6 py-3 bg-white text-ink border-2 border-ink font-display font-bold uppercase hover:bg-danger transition-all"><IconDownload /> {t.btnDownloadTrash}</button>)}
                  </div>
                </div>
              </div>
            )}
          </main>
          
          <footer className="border-t-4 border-ink bg-grid-ink text-bone py-16 px-6 mt-auto font-sans">
            <div className="max-w-7xl mx-auto flex flex-col items-center text-center">
              <p className="text-2xl font-display font-bold italic mb-12">"{t.footerPhrase}"</p>
              
              {/* TÍTULO Y CAJA DE PROYECTOS ARREGLADOS (SIN SOMBRAS, SIN MÁRGENES NEGATIVOS) */}
              <div className="w-full max-w-4xl border-4 border-highlight bg-grid-bone text-ink p-8 mb-12 text-left">
                <h4 className="font-display font-black text-2xl uppercase mb-8 border-4 border-ink bg-white inline-block px-4 py-2">{t.footerOtherProjects}</h4>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div className="bg-white border-4 border-ink p-6 flex flex-col items-start transition-transform hover:-translate-y-1">
                    <a href="https://typemerge.com" target="_blank" className="inline-block font-display font-black text-xl hover:text-highlight transition-colors bg-ink text-bone px-2 py-1 uppercase tracking-tighter">TypeMerge.com</a>
                    <p className="text-sm mt-4 text-ink font-medium leading-relaxed">{t.footerProj1Desc}</p>
                  </div>
                  <div className="bg-white border-4 border-ink p-6 flex flex-col items-start transition-transform hover:-translate-y-1">
                    <a href="https://textopress.netlify.app" target="_blank" className="inline-block font-display font-black text-xl hover:text-highlight transition-colors bg-ink text-bone px-2 py-1 uppercase tracking-tighter">TextoPress</a>
                    <p className="text-sm mt-4 text-ink font-medium leading-relaxed">{t.footerProj2Desc}</p>
                  </div>
                </div>
              </div>

              {/* ENLACES pSEO PARA INDEXACIÓN (Googlebot only) */}
              <div className="mb-12 flex flex-wrap justify-center gap-4 text-xs opacity-40 font-mono uppercase font-bold tracking-widest max-w-3xl">
                <a href="/?nicho=Mailchimp" className="hover:text-highlight">Mailchimp</a>
                <a href="/?nicho=HubSpot" className="hover:text-highlight">HubSpot</a>
                <a href="/?nicho=ActiveCampaign" className="hover:text-highlight">ActiveCampaign</a>
                <a href="/?nicho=Shopify" className="hover:text-highlight">Shopify</a>
                <a href="/?nicho=B2B" className="hover:text-highlight">B2B Leads</a>
                <a href="/?nicho=Klaviyo" className="hover:text-highlight">Klaviyo</a>
                <a href="/?nicho=Cold-Email" className="hover:text-highlight">Cold Email</a>
              </div>

              {/* BOTÓN DEL AUTOR (SIN SOMBRAS BLANCAS) */}
              <div className="inline-block border-4 border-bone px-4 py-2 font-mono text-sm font-bold bg-highlight text-ink mb-4 transition-transform hover:-translate-y-1">
                {t.footerAuthor} <a href="https://reneblanco.com" target="_blank" className="underline decoration-2">René Blanco</a>
              </div>
              <p className="text-xs text-bone/60 max-w-3xl mx-auto leading-relaxed border-t-2 border-bone/20 pt-4 mt-2">{t.footerPrivacy}</p>
            </div>
          </footer>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
